[package]
name = "rekordbox-usb-converter"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Converts FLAC files on Rekordbox-exported USB drives to 320k MP3 while preserving the Pioneer database"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "rekordbox_usb_converter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rbusb-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
