# rbusb-core: pure business logic for the Rekordbox USB FLAC->MP3 converter.
# This crate must NOT depend on Tauri or any UI framework, so it stays
# independently testable and reusable (e.g. for a future CLI).
[package]
name = "rbusb-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "DrokerBox core: USB detection, Rekordbox export scanning, PDB/ANLZ rewriting, FFmpeg conversion, cache and pipeline"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
walkdir = "2"
crc32fast = "1"
rayon = "1"
rekordbox-pdb = { path = "../vendor/rekordbox-pdb" }
rekordcrate = { version = "0.3.0", default-features = false, optional = true }
binrw = { version = "0.14", optional = true }

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
] }

[features]
default = []
rekordcrate = ["dep:rekordcrate", "dep:binrw"]
